# Grafana-managed alert rules for SimpleLogin (file provisioning format).
# Generated by monitor/grafana/generate_alerts.py: edit thresholds there, not here.
# Every rule carries the labels service=simplelogin and severity=warning|critical
# so a notification policy can route on them.
apiVersion: 1
groups:
  - orgId: 1
    name: "simplelogin-availability"
    folder: "SimpleLogin"
    interval: "1m"
    rules:
      - uid: "sl-target-down"
        title: "SimpleLogin host not scraped"
        condition: "C"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "ef2extxyzeigwc"
            model:
              refId: "A"
              expr: "min by (instance) (up{job=\"simplelogin-upcloud\", instance=~\"prod.*\"})"
              instant: true
              range: false
              legendFormat: "{{instance}}"
          - refId: "C"
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "A"
              conditions:
                - evaluator:
                    type: "lt"
                    params:
                      - 1
        for: "3m"
        noDataState: "Alerting"
        execErrState: "Error"
        labels:
          service: "simplelogin"
          severity: "critical"
        annotations:
          summary: "Prometheus cannot scrape {{ $labels.instance }}: the host or its exporter is down."
          description: "CRITICAL: SimpleLogin host not scraped when < 1 for 3m"
          __dashboardUid__: "simplelogin-alerts"
          __panelId__: "3"
      - uid: "sl-email-handlers-lost"
        title: "SimpleLogin email handler processes lost"
        condition: "C"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "ef2extxyzeigwc"
            model:
              refId: "A"
              expr: "(count by (instance) (process_start_time_seconds{job=\"simplelogin-upcloud\", env=\"prod-proton\", container=~\"sl-email.*\"}) or count by (instance) (process_start_time_seconds{job=\"simplelogin-upcloud\", env=\"prod-proton\", container=~\"sl-email.*\"} offset 15m) * 0) / max_over_time((count by (instance) (process_start_time_seconds{job=\"simplelogin-upcloud\", env=\"prod-proton\", container=~\"sl-email.*\"}))[1h:1m])"
              instant: true
              range: false
              legendFormat: "{{instance}}"
          - refId: "C"
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "A"
              conditions:
                - evaluator:
                    type: "lt"
                    params:
                      - 0.8
        for: "5m"
        noDataState: "OK"
        execErrState: "Error"
        labels:
          service: "simplelogin"
          severity: "critical"
        annotations:
          summary: "{{ $labels.instance }} runs less than 80% of the email handler processes it had in the last hour."
          description: "CRITICAL: SimpleLogin email handler processes lost when < 0.8 for 5m"
          __dashboardUid__: "simplelogin-alerts"
          __panelId__: "4"
      - uid: "sl-crash-loop"
        title: "SimpleLogin container crash looping"
        condition: "C"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "ef2extxyzeigwc"
            model:
              refId: "A"
              expr: "max by (instance, group) (label_replace(changes(process_start_time_seconds{job=\"simplelogin-upcloud\", env=\"prod-proton\"}[15m]), \"group\", \"$1\", \"container\", \"(sl-[a-z-]+?)(-[0-9]+)?\"))"
              instant: true
              range: false
              legendFormat: "{{instance}} {{group}}"
          - refId: "C"
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "A"
              conditions:
                - evaluator:
                    type: "gt"
                    params:
                      - 3
        for: "5m"
        noDataState: "OK"
        execErrState: "Error"
        labels:
          service: "simplelogin"
          severity: "warning"
        annotations:
          summary: "A {{ $labels.group }} container on {{ $labels.instance }} restarted more than 3 times in 15 minutes."
          description: "WARNING: SimpleLogin container crash looping when > 3 for 5m"
          __dashboardUid__: "simplelogin-alerts"
          __panelId__: "5"
  - orgId: 1
