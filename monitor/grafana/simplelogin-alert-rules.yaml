              instant: true
              range: false
              legendFormat: "5xx ratio"
          - refId: "C"
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "A"
              conditions:
                - evaluator:
                    type: "gt"
                    params:
                      - 0.02
        for: "5m"
        noDataState: "OK"
        execErrState: "Error"
        labels:
          service: "simplelogin"
          severity: "critical"
        annotations:
          summary: "More than 2% of sl-partner-api responses are 5xx (only counted when there are more than 5 errors in 5 minutes)."
          description: "CRITICAL: SimpleLogin partner API 5xx errors when > 0.02 for 5m"
          __dashboardUid__: "simplelogin-alerts"
          __panelId__: "8"
      - uid: "sl-app-no-traffic"
        title: "SimpleLogin web app receives no traffic"
        condition: "C"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "ef2extxyzeigwc"
            model:
              refId: "A"
              expr: "sum(rate(simplelogin_custom_event_httpresponsestatus_total{job=\"simplelogin-upcloud\", env=\"prod-proton\", container=~\"sl-app.*\"}[5m]))"
              instant: true
              range: false
              legendFormat: "requests /s"
          - refId: "C"
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "A"
              conditions:
                - evaluator:
                    type: "lt"
                    params:
                      - 0.05
        for: "10m"
        noDataState: "Alerting"
        execErrState: "Error"
        labels:
          service: "simplelogin"
          severity: "critical"
        annotations:
          summary: "sl-app served almost no requests for 10 minutes: it is down or unreachable."
          description: "CRITICAL: SimpleLogin web app receives no traffic when < 0.05 for 10m"
          __dashboardUid__: "simplelogin-alerts"
          __panelId__: "9"
      - uid: "sl-partner-api-no-traffic"
        title: "SimpleLogin partner API receives no traffic"
        condition: "C"
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "ef2extxyzeigwc"
            model:
              refId: "A"
              expr: "sum(rate(simplelogin_custom_event_httpresponsestatus_total{job=\"simplelogin-upcloud\", env=\"prod-proton\", container=~\"sl-partner-api.*\"}[5m]))"
              instant: true
              range: false
              legendFormat: "requests /s"
          - refId: "C"
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: "__expr__"
            model:
              refId: "C"
              type: "threshold"
              expression: "A"
              conditions:
                - evaluator:
                    type: "lt"
                    params:
                      - 0.1
        for: "10m"
        noDataState: "Alerting"
        execErrState: "Error"
        labels:
          service: "simplelogin"
          severity: "critical"
        annotations:
          summary: "sl-partner-api served almost no requests for 10 minutes: it is down or unreachable."
          description: "CRITICAL: SimpleLogin partner API receives no traffic when < 0.1 for 10m"
          __dashboardUid__: "simplelogin-alerts"
