name: Build PR image

# On-demand job that builds and pushes a Docker image for a pull request, tagged
# with the short SHA of the PR head commit: simplelogin/app-ci:<short-sha>
#
# It never runs on push. To build an image, add the `build-image` label to the
# PR. When the job finishes, it removes the label, so adding it again builds the
# current head commit again. It is not a required check: it never blocks merging.
#
# Who can run it: adding a label needs triage access or more, and the job also
# checks that whoever added the label has write, maintain or admin permission.
#
# PRs from forks are skipped: GitHub does not expose secrets to them.

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  # to remove the label once done
  pull-requests: write

concurrency:
  group: pr-image-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event.label.name == 'build-image' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      SENDER: ${{ github.event.sender.login }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Check that the label was added by a project developer
        run: |
          permission=$(gh api "repos/${REPO}/collaborators/${SENDER}/permission" --jq .permission)
          echo "${SENDER} has '${permission}' permission on ${REPO}"
          case "${permission}" in
            admin|maintain|write) ;;
            *)
              echo "::error::Only project developers can build PR images"
              exit 1
              ;;
          esac

      - name: Compute image tag
        id: tag
        run: echo "short_sha=${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"

      # The PR head commit, not the merge commit GitHub creates for pull_request
      - name: Checkout PR head commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Prepare version file
        run: |
          scripts/generate-build-info.sh "${HEAD_SHA}" "pr-${PR_NUMBER}"
          cat app/build_info.py

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image and publish to Docker Registry
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: simplelogin/app-ci:${{ steps.tag.outputs.short_sha }}

      - name: Summary
        env:
          IMAGE: simplelogin/app-ci:${{ steps.tag.outputs.short_sha }}
        run: |
          echo "### Image for PR #${PR_NUMBER}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${IMAGE}\` (commit ${HEAD_SHA})" >> "$GITHUB_STEP_SUMMARY"

      # Remove the label (even if the build failed) so adding it again re-runs
      - name: Remove build-image label
        if: always()
        run: gh api -X DELETE "repos/${REPO}/issues/${PR_NUMBER}/labels/build-image" || true
